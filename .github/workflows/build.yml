# Tests every push and pull request. Pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# additionally builds the universal app and publishes FolderSync-<version>.dmg / .zip as a GitHub Release.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: scripts/test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Package
        run: scripts/make-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Install

          1. Download **FolderSync-$VERSION.dmg** below and open it.
          2. Drag **FolderSync** onto **Applications**.
          3. Open FolderSync from Applications. It also appears in the menu bar.

          FolderSync is open source and not notarized by Apple, so the first time you open it macOS says it
          cannot verify the app. Click **Done**, then go to **System Settings → Privacy & Security** and click
          **Open Anyway** next to the FolderSync message. You only need to do this once per version.

          Requires macOS 14 or later. Universal app for Apple silicon and Intel Macs.
          Checksums are in SHA256SUMS.txt.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "build/FolderSync-$VERSION.dmg" "build/FolderSync-$VERSION.zip" build/SHA256SUMS.txt \
            --title "FolderSync $VERSION" --notes-file notes.md
